<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Политика безопасности контента. Приложение работает только со своими файлами и двумя
         внешними сервисами: GitHub API (проверка обновлений) и подсказки Дадаты (адреса).
         script-src/style-src содержат 'unsafe-inline', потому что тема оформления
         устанавливается встроенным скриптом ниже (это убирает «мигание» светлой темы);
         сторонние скрипты всё равно запрещены. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com https://suggestions.dadata.ru; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>SelfCRM</title>
    <script>
      // Устанавливаем тему до отрисовки, чтобы не было «мигания» светлой темы.
      (function () {
        try {
          var saved = localStorage.getItem('selfcrm:theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
